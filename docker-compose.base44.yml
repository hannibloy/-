services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    command: >-
      sh -c "sed -i 's/user  nginx;/user root;/' /etc/nginx/nginx.conf && printf 'server { listen 80; server_name _; root /usr/share/nginx/html; index canva-dashboard.html; location / { try_files $$uri $$uri/ /canva-dashboard.html; } }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:80/canva-dashboard.html"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
