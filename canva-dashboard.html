// ============ RENDER ============
const container = document.getElementById('categoriesContainer');
const catNav = document.getElementById('catNav');
let totalCount = 0;
data.forEach(cat => totalCount += cat.projects.length);
document.getElementById('totalCount').textContent = totalCount;

// Category chips
const allChip = document.createElement('button');
allChip.className = 'cat-chip active';
allChip.dataset.cat = 'all';
allChip.innerHTML = `🌐 הכל <span class="count">${totalCount}</span>`;
catNav.appendChild(allChip);

data.forEach(cat => {
  const chip = document.createElement('button');
  chip.className = 'cat-chip';
  chip.dataset.cat = cat.id;
  chip.innerHTML = `${cat.icon} ${cat.name} <span class="count">${cat.projects.length}</span>`;
  catNav.appendChild(chip);
});

// Category sections
data.forEach(cat => {
  const section = document.createElement('section');
  section.className = 'category-section';
  section.dataset.cat = cat.id;
  section.style.setProperty('--accent', cat.color);
  section.style.setProperty('--accent2', cat.color2);

  const header = document.createElement('div');
  header.className = 'category-header';
  header.innerHTML = `
    <div class="icon">${cat.icon}</div>
    <div>
      <h2>${cat.name}</h2>
      <div class="desc">${cat.desc} · ${cat.projects.length} פרויקטים</div>
    </div>
  `;
  section.appendChild(header);

  const grid = document.createElement('div');
  grid.className = 'projects-grid';
  cat.projects.forEach(p => {
    const card = document.createElement('div');
    card.className = 'project-card';
    card.style.setProperty('--accent', cat.color);
    card.style.setProperty('--accent2', cat.color2);
    card.dataset.title = p.title;

    const initial = p.title.replace(/[^\u0590-\u05FFa-zA-Z]/g, '').charAt(0) || '🎨';

    card.innerHTML = `
      <div class="thumb-wrapper">
        <img src="${p.thumb}" alt="${p.title}" referrerpolicy="no-referrer" onerror="this.parentElement.classList.add('no-img')" />
        <div class="fallback">${cat.icon}<br>${initial}</div>
      </div>
      <div class="project-body">
        <div class="project-title">${p.title}</div>
        <div class="project-meta">
          <span>📄 ${p.pages} ${p.pages === 1 ? 'עמוד' : 'עמודים'}</span>
        </div>
        <div class="project-actions">
          <a class="btn btn-edit" href="https://www.canva.com/design/${p.id}/edit" target="_blank">✏️ עריכה</a>
          <a class="btn btn-view" href="https://www.canva.com/design/${p.id}/view" target="_blank">👁️ צפייה</a>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
  section.appendChild(grid);
  container.appendChild(section);
});

// ============ FILTERING ============
const searchInput = document.getElementById('searchInput');

function applyFilters() {
  const query = searchInput.value.trim().toLowerCase();
  const activeCat = document.querySelector('.cat-chip.active').dataset.cat;

  document.querySelectorAll('.category-section').forEach(section => {
    const catMatch = activeCat === 'all' || section.dataset.cat === activeCat;
    let visibleCount = 0;

    section.querySelectorAll('.project-card').forEach(card => {
      const titleMatch = card.dataset.title.toLowerCase().includes(query);
      const show = catMatch && titleMatch;
      card.style.display = show ? '' : 'none';
      if (show) visibleCount++;
    });

    section.classList.toggle('hidden', !catMatch || visibleCount === 0);
  });
}

searchInput.addEventListener('input', applyFilters);

catNav.addEventListener('click', e => {
  const chip = e.target.closest('.cat-chip');
  if (!chip) return;
  document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  applyFilters();
  window.scrollTo({ top: 300, behavior: 'smooth' });
});

// View toggle
document.querySelectorAll('.view-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.body.classList.toggle('projects-list', btn.dataset.view === 'list');
  });
});
</script>
